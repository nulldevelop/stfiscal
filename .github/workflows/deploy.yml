name: Deploy Next.js to IIS
on:
  push:
    branches: [main]
jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Deploy
        shell: powershell
        run: |
          $dest = "C:\inet\wwwroot\sira"
          Stop-WebAppPool -Name "NextJSAppPool"
          Start-Sleep -Seconds 3
          Remove-Item "$dest\*" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path ".next\standalone\*" -Destination $dest -Recurse
          Copy-Item -Path ".next\static" -Destination "$dest\.next\static" -Recurse
          Copy-Item -Path "web.config" -Destination $dest
          Start-WebAppPool -Name "NextJSAppPool"
